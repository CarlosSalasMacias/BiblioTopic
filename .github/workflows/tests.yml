name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scipy scikit-learn networkx matplotlib openpyxl python-docx pycountry adjustText pytest
      - run: pytest -q tests -W ignore::DeprecationWarning
